# Standalone pnpm workspace for the pre-publish e2e — isolated from the monorepo
# root so the builder toolchains never leak into core dev. Mirrors the benchmark
# _deps posture.
packages: []

# ── Supply-chain protection ──────────────────────────────
# Block all dependency lifecycle scripts; only the packages below may run them.
# esbuild ships its platform binary via a postinstall fetch.
allowBuilds:
  esbuild: true
  sharp: false # next's optional image-optimization dep; smoke-next renders no images

# Refuse to resolve package versions younger than 30 days (defeats
# fast-spreading malicious releases). Applies on fresh resolve. The packages
# UNDER TEST are exempt: each e2e run publishes them to verdaccio moments before
# installing, so they are always younger than the cutoff. One scope now: the
# whole family is @mionjs/* since the namespace rename.
minimumReleaseAge: 43200
minimumReleaseAgeExclude:
  - '@mionjs/*'
  # security fix (Dependabot), added 2026-11-08
  - 'next@16.4.1'
  - '@next/env@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'

# Block exotic transitive sources; direct deps may declare any source.
blockExoticSubdeps: true

# Exact pinning on `pnpm add`; peers non-strict (the many bundlers cross-declare peers).
savePrefix: ''
strictPeerDependencies: false
autoInstallPeers: true
nodeLinker: hoisted

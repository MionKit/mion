# Standalone pnpm workspace for the mion half of the pre-publish e2e — isolated
# from the monorepo root AND from the runtypes _deps root, so the two consumer
# toolchains never have to agree on a vite or typescript version. Mirrors the
# _deps posture otherwise.
packages: []

# ── Supply-chain protection ──────────────────────────────
# Block all dependency lifecycle scripts; only the packages below may run them.
# esbuild ships its platform binary via a postinstall fetch, and vite 8 still
# pulls it for the dep optimizer. workerd (miniflare's runtime) ships its binary
# through an optional platform dep, so its postinstall stays off, as at the root.
allowBuilds:
  esbuild: true
  workerd: false

# Refuse to resolve package versions younger than 30 days (defeats
# fast-spreading malicious releases). Applies on fresh resolve. The packages
# UNDER TEST are exempt: each e2e run publishes them to verdaccio moments before
# installing, so they are always younger than the cutoff.
minimumReleaseAge: 43200
minimumReleaseAgeExclude:
  - '@mionjs/*'
  # security fix (Dependabot), added 2026-11-08
  - 'vitest@4.1.12'
  - '@vitest/expect@4.1.12'
  - '@vitest/mocker@4.1.12'
  - '@vitest/pretty-format@4.1.12'
  - '@vitest/runner@4.1.12'
  - '@vitest/snapshot@4.1.12'
  - '@vitest/spy@4.1.12'
  - '@vitest/utils@4.1.12'

# Block exotic transitive sources; direct deps may declare any source.
blockExoticSubdeps: true

# Exact pinning on `pnpm add`; peers non-strict (the published mion packages
# cross-declare loose vite/typescript peers).
savePrefix: ''
strictPeerDependencies: false
autoInstallPeers: true
nodeLinker: hoisted

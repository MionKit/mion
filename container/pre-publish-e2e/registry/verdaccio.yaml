# Throwaway local registry for the pre-publish e2e, baked into the shared image
# and started by e2e-serve.sh. The serve script publishes the packed tarballs
# here; the in-container matrix, the mion consumer lanes and the host-native smoke
# then install the PUBLISHED @mionjs/* + @mionjs/* from it — faithfully
# exercising the launcher ->
# @mionjs/native-compiler-<os>-<arch> optional-dependency resolution a bare
# file-tarball install can't.
#
# Anonymous publish + read are allowed on purpose (ephemeral, loopback only).
# Everything not published locally (unplugin, the host-smoke's vite/vitest, …)
# proxies to npmjs.
storage: /tmp/verdaccio-storage
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: false
packages:
  # The packages UNDER TEST (both families live under @mionjs/* now): served ONLY
  # from the locally published tarballs, never proxied to real npm. Otherwise
  # publishing a version already live on npm 409s (`cannot publish over the
  # previously published versions`), and an install could even resolve the real-npm
  # build instead of the packed tarball: the packed framework packages declare
  # their type-system siblings by exact version, and the cross-family resolution
  # this e2e exists to prove would silently be satisfied by real npm. MUST precede
  # the '@*/*' rule - verdaccio matches the first pattern. ONE block: a repeated
  # key is a YAML error, and verdaccio then refuses the whole file ("it does not
  # look like a valid config"). Twin of .github/verdaccio.yaml (host-npx backend).
  '@mionjs/*':
    access: $all
    publish: $all
    unpublish: $all
  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
# The platform-binary tarballs are ~8 MB, and `npm publish` base64-wraps the
# tarball into the JSON PUT body (~1.33x), exceeding verdaccio's ~10 MB default
# and 413-ing. Raise the ceiling generously.
max_body_size: 200mb
publish:
  allow_offline: true
log:
  type: stdout
  format: pretty
  level: warn

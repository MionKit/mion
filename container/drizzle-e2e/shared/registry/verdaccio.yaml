# Throwaway local registry for the drizzle-e2e lane, baked into all three images
# and started by drizzle-serve.sh. The serve script publishes the packed tarballs
# here; the lane then installs the PUBLISHED @mionjs/drizzle-orm* and
# @mionjs/bin from it, so it exercises the tarballs that would ship rather
# than the workspace sources.
#
# @mionjs/bin is what carries the translator into the container: installing
# it pulls the linux @mionjs/binary-<arch> optional dependency, so the lane
# runs the same `mion drizzle-migrate` a consumer would.
#
# Anonymous publish + read are allowed on purpose (ephemeral, loopback only).
# Everything not published locally (drizzle-orm, vitest, the drivers) is already
# baked into the image, so the uplink is only a fallback.
storage: /tmp/verdaccio-storage
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: false
packages:
  # The packages UNDER TEST: served ONLY from the locally published tarballs,
  # never proxied to real npm. Otherwise publishing a version already live on npm
  # 409s, and an install could resolve the real-npm build instead of the packed
  # tarball. MUST precede the '@*/*' rule - verdaccio matches the first pattern.
  '@mionjs/*':
    access: $all
    publish: $all
    unpublish: $all
  '@mionjs/*':
    access: $all
    publish: $all
    unpublish: $all
  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
# The platform-binary tarballs are ~8 MB, and `npm publish` base64-wraps the
# tarball into the JSON PUT body (~1.33x), exceeding verdaccio's ~10 MB default
# and 413-ing. Raise the ceiling generously.
max_body_size: 200mb
publish:
  allow_offline: true
log:
  type: stdout
  format: pretty
  level: warn

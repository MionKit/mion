# Standalone pnpm workspace for the drizzle-e2e lane — isolated from the monorepo
# root so the database drivers (pg, mysql2, better-sqlite3, dockerode) never leak
# into core dev or the workspace lockfile. Mirrors the pre-publish-e2e posture.
packages: []

# ── Supply-chain protection ──────────────────────────────
# Block all dependency lifecycle scripts; only the packages below may run them.
# better-sqlite3 is a native addon: its install step fetches a prebuild (and
# falls back to building), so it is the one package that must run scripts.
allowBuilds:
  better-sqlite3: true
  # dockerode's transitive tree. All DENIED, but listed: pnpm 11 fails an install
  # that silently ignores a build script, so a package that wants one has to be
  # answered either way. dockerode itself is only here because pg-common.ts and
  # mysql-common.ts import it at the top level for a docker helper the lane never
  # reaches (it sets the connection string instead).
  cpu-features: false
  protobufjs: false
  ssh2: false
  # The Cloudflare lanes' two native-binary packages. DENIED, like the tree above:
  # both ship their real binary as an optional @scope/<platform> dependency that
  # npm/pnpm installs directly, and both resolve it at runtime without their
  # install script. Listed rather than left out because pnpm 11 fails an install
  # that silently ignores a build script. The cloudflare Containerfile asserts the
  # workerd binary landed, so a wrong call here fails the BUILD, not a run.
  esbuild: false
  workerd: false

# Refuse to resolve package versions younger than 30 days (defeats
# fast-spreading malicious releases). The packages UNDER TEST are exempt: each
# run publishes them to verdaccio moments before installing them.
minimumReleaseAge: 43200
minimumReleaseAgeExclude:
  - '@ts-runtypes/*'
  - '@mionjs/*'

# Block exotic transitive sources; direct deps may declare any source.
blockExoticSubdeps: true

# Exact pinning on `pnpm add`; peers non-strict.
savePrefix: ''
strictPeerDependencies: false
autoInstallPeers: true
nodeLinker: hoisted

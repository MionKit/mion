<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mions Play</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 45%, #22304a 0%, #161f33 55%, #0e1424 100%); }
  canvas { display: block; }
  #sound { position: fixed; right: 16px; top: 14px; font: 13px/1 system-ui, sans-serif; color: #c9d4ea; background: #26324ccc; border: 1px solid #3a4a6c; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  #sound:hover { background: #31406199; }
  #hint { position: fixed; left: 16px; bottom: 14px; font: 13px/1.3 system-ui, sans-serif; color: #8d9bb8; user-select: none; pointer-events: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
</head>
<body>
<button id="sound" type="button">Sound off</button>
<div id="hint">Click a mion to make it jump, or a floating piece to drop it</div>
<script type="module">
// The mions hop between floating terrain pieces that circle the island, drawn on the graphics chip with PixiJS and moved with GSAP.
// The svg files are only read: each one is cut into layers here (shadow, body, eye whites, pupils), so the assets stay as they are.

const W0 = -150, H0 = 110, VIEW_W = 1360, VIEW_H = 900;   // the part of the scene (half-size reference pixels) that fits the window
const rand = (a, b) => a + Math.random() * (b - a);
const pick = list => list[Math.floor(Math.random() * list.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const wait = s => new Promise(done => gsap.delayedCall(s, done));

const app = new PIXI.Application();
await app.init({ resizeTo: window, antialias: true, backgroundAlpha: 0, resolution: devicePixelRatio, autoDensity: true });
document.body.appendChild(app.canvas);
const sky = new PIXI.Container(), world = new PIXI.Container();
world.sortableChildren = true;
app.stage.addChild(sky, world);
let view = 1;
const fit = () => {
  view = Math.min(innerWidth / VIEW_W, innerHeight / VIEW_H);
  for (const layer of [sky, world]) { layer.scale.set(view); layer.position.set(-W0 * view + (innerWidth - VIEW_W * view) / 2, -H0 * view + (innerHeight - VIEW_H * view) / 2); }
};
fit(); addEventListener('resize', fit);

// ---- cutting an svg file into layers --------------------------------------------------------------
const host = Object.assign(document.createElement('div'), { style: 'position:absolute;left:-99999px;top:0;visibility:hidden' });
document.body.appendChild(host);
const texts = {}, cuts = {};
const ser = new XMLSerializer();
const texture = (svg, crop, R) => new Promise((done, fail) => {
  svg.setAttribute('viewBox', `${crop.x} ${crop.y} ${crop.w} ${crop.h}`);
  svg.setAttribute('width', Math.ceil(crop.w * R)); svg.setAttribute('height', Math.ceil(crop.h * R));
  const img = new Image();
  img.onload = () => done(PIXI.Texture.from(img)); img.onerror = fail;
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ser.serializeToString(svg));
});

async function cut(src, R, spotsEvery = 0) {
  const key = `${src}@${R.toFixed(2)}`;
  return cuts[key] ??= (async () => {
    host.innerHTML = await (texts[src] ??= fetch(src).then(r => r.text()));
    const svg = host.querySelector('svg');
    const { x: vx, y: vy, width: vw, height: vh } = svg.viewBox.baseVal;
    svg.setAttribute('width', vw); svg.setAttribute('height', vh);
    const o = svg.getBoundingClientRect();
    const box = (el, pad = 0) => { const r = el.getBoundingClientRect(); return { x: r.left - o.left + vx - pad, y: r.top - o.top + vy - pad, w: r.width + 2 * pad, h: r.height + 2 * pad }; };
    const out = { R, full: { x: vx, y: vy, w: vw, h: vh }, eyes: [] };

    const shadow = svg.querySelector('#shadow') || svg.querySelector('[id$="-shadow"]');
    if (shadow) { shadow.dataset.cut = 's'; out.shadowBox = box(shadow, 16); const b = box(shadow); out.anchor = { x: b.x + b.w / 2, y: b.y + b.h / 2 }; }
    else out.anchor = { x: vx + vw / 2, y: vy + vh };
    svg.querySelectorAll('[id^="eye-"]').forEach((eye, i) => {
      const kids = eye.children, pupil = kids[kids.length - 1], white = kids[kids.length - 2];
      if (kids.length < 3 || pupil.tagName !== 'g' || eye.querySelector('[clip-path]')) return;
      pupil.dataset.cut = 'p' + i; white.dataset.cut = 'w' + i;
      const wb = box(white, 1);
      out.eyes.push({ i, white: wb, pupil: box(pupil, 1), reach: Math.min(wb.w, wb.h) * 0.2 });
    });
    // where a mion can stand: a terrain tile's top face, or spots spread over the island's grass
    const top = svg.querySelector('[id$="-top-clip"] path') || svg.querySelector('path[fill="url(#gi-top)"]');
    if (top) {
      const b = top.getBBox(); out.top = { x: b.x, y: b.y, w: b.width, h: b.height };
      if (spotsEvery) {
        out.spots = [];
        const inside = (x, y) => top.isPointInFill(new DOMPoint(x, y));
        for (let y = b.y; y < b.y + b.height; y += spotsEvery * 0.56) for (let x = b.x; x < b.x + b.width; x += spotsEvery)
          if ([[0, 0], [-40, 0], [40, 0], [0, -22], [0, 22]].every(([dx, dy]) => inside(x + dx, y + dy))) out.spots.push({ x, y });
      }
    }
    const layer = async (keep, crop) => {
      const c = svg.cloneNode(true);
      if (keep === 'body') c.querySelectorAll('[data-cut="s"], [data-cut^="p"]').forEach(el => el.remove());
      else {
        const t = c.querySelector(`[data-cut="${keep}"]`);
        for (let el = t; el !== c; el = el.parentNode) for (const s of [...el.parentNode.children]) if (s !== el && s.tagName !== 'defs') s.remove();
        if (keep[0] === 'w') for (const el of [t, ...t.querySelectorAll('*')]) { el.setAttribute('fill', '#fff'); el.removeAttribute('stroke'); }
      }
      return { tex: await texture(c, crop, R), crop };
    };
    out.body = await layer('body', out.full);
    if (shadow) out.shadow = await layer('s', out.shadowBox);
    for (const e of out.eyes) { e.mask = await layer('w' + e.i, e.white); e.dot = await layer('p' + e.i, e.pupil); }
    host.innerHTML = '';
    return out;
  })();
}

// an actor is one svg as a root on the ground (its shadow) and a body above it that can bob and squash
async function actor(src, unit, maxScale = 1, spotsEvery = 0) {
  const L = await cut(src, Math.min(4, Math.max(1, unit * maxScale * view * devicePixelRatio * 1.2)), spotsEvery);
  const sprite = ({ tex, crop }) => { const s = new PIXI.Sprite(tex); s.scale.set(1 / L.R); s.position.set(crop.x - L.anchor.x, crop.y - L.anchor.y); return s; };
  const root = new PIXI.Container(), body = new PIXI.Container();
  root.scale.set(unit);
  if (L.shadow) { const sh = sprite(L.shadow); root.addChild(sh); root.shadow = sh; }
  root.addChild(body); body.addChild(sprite(L.body));
  const eyes = L.eyes.map(e => {
    const mask = sprite(e.mask), dot = sprite(e.dot);
    body.addChild(mask, dot); dot.mask = mask;
    return { dot, home: { x: dot.x, y: dot.y }, centre: { x: e.white.x + e.white.w / 2 - L.anchor.x, y: e.white.y + e.white.h / 2 - L.anchor.y }, reach: e.reach, gx: 0, gy: 0 };
  });
  return { root, body, eyes, L, unit };
}

// ---- the sky -------------------------------------------------------------------------------------
// the star and pebble layers tile well past the window on every side, every other tile mirrored so the repeat is hard to spot
for (const src of ['sky/stars.svg', 'sky/pebbles.svg']) for (let ty = -2; ty <= 2; ty++) for (let tx = -2; tx <= 3; tx++) {
  const a = await actor(src, 1);
  a.root.position.set(500 + tx * 1000, 1000 + ty * 1000);
  if ((tx + ty) % 2) a.root.scale.x = -1;
  sky.addChild(a.root);
}
// twinkles sit in screen space, spread over the whole window whatever its shape
const twinkleLayer = new PIXI.Container(), twinkles = [];
app.stage.addChildAt(twinkleLayer, 1);
for (let i = 0; i < 140; i++) {
  const g = new PIXI.Graphics().star(0, 0, 4, rand(1.5, 3.5), 0.6).fill({ color: pick([0xffffff, 0xcfe3ff, 0xffe6c4]) });
  Object.assign(g, { fx: Math.random(), fy: Math.random(), phase: rand(0, 6.28), speed: rand(0.6, 1.6) });
  twinkleLayer.addChild(g); twinkles.push(g);
}
const spread = () => { for (const g of twinkles) g.position.set(g.fx * innerWidth, g.fy * innerHeight); };
spread(); addEventListener('resize', spread);

// ---- island and the terrain carousel -------------------------------------------------------
const place = (a, left, top, width) => a.root.position.set(left + (a.L.anchor.x - a.L.full.x) * width / a.L.full.w, top + (a.L.anchor.y - a.L.full.y) * width / a.L.full.w);
const island = await actor('terrain/grass-island.svg', 946 / 600, 1, 34);
place(island, 57, 307, 946); world.addChild(island.root);
const toWorld = (a, p) => ({ x: a.root.x + (p.x - a.L.anchor.x) * a.root.scale.x, y: a.root.y + (p.y - a.L.anchor.y + a.body.y) * a.root.scale.y });
island.root.zIndex = toWorld(island, island.L.top).y + 20;
const islandSpots = island.L.spots.map(p => toWorld(island, p));
const centre = toWorld(island, { x: island.L.top.x + island.L.top.w / 2, y: island.L.top.y + island.L.top.h / 2 });

const KINDS = ['mountain-orange', 'mountain-orange-low', 'cone-yellow-teal', 'cone-small-teal', 'mound-sand-cream', 'block-blue', 'block-slate',
  'tile-teal-light', 'mound-sand-small', 'cone-cream', 'tile-teal', 'mound-orange'];
// mountains stay near their own size, small tiles grow enough to hold a mion
const sizeFor = kind => kind.startsWith('mountain') ? rand(0.75, 1.15) : /tile|block/.test(kind) ? rand(1.3, 2.3) : rand(1.1, 1.9);
const rings = [{ count: 12, rx: 610, ry: 330, speed: 0.035 }, { count: 9, rx: 790, ry: 440, speed: 0.022 }];
const pieces = [];
for (const [r, ring] of rings.entries()) for (let i = 0; i < ring.count; i++) {
  const kind = KINDS[(i * 5 + r * 7) % KINDS.length];
  const size = sizeFor(kind);
  const a = await actor(`terrain/${kind}.svg`, 0.5, 2.4);
  a.root.scale.set(0.5 * size);
  // tiles take a mion in the middle of their top, cones and mounds on the strip in front of the peak
  const t = a.L.top, flat = /tile|block/.test(kind);
  const spot = { x: t.x + t.w / 2, y: t.y + t.h * (flat ? 0.5 : 0.8) };
  Object.assign(a, { kind, ring, angle: (i / ring.count) * Math.PI * 2 + r * 0.3 + rand(-0.12, 0.12), wobble: rand(0.92, 1.08), phase: rand(0, 6.28), slots: [{ ...spot, holder: null }] });
  a.root.eventMode = 'static'; a.root.cursor = 'pointer';
  a.root.on('pointertap', () => drop(a));
  world.addChild(a.root); pieces.push(a);
}
// mushroom trees stand still around the island: two small ones behind it, a full-size one below its front, drawn over the island but under everything else
const tb = island.L.top, nw = toWorld(island, tb), se = toWorld(island, { x: tb.x + tb.w, y: tb.y + tb.h });
const corner = { left: { x: nw.x, y: (nw.y + se.y) / 2 }, back: { x: (nw.x + se.x) / 2, y: nw.y }, right: { x: se.x, y: (nw.y + se.y) / 2 }, front: { x: (nw.x + se.x) / 2, y: se.y } };
const along = (a, b, t, dx, dy) => ({ x: lerp(a.x, b.x, t) + dx, y: lerp(a.y, b.y, t) + dy });
const TREES = [
  { at: along(corner.left, corner.back, 0.42, -55, 10), size: 0.56 },
  { at: along(corner.back, corner.right, 0.62, 5, 5), size: 0.69 },
  { at: along(corner.left, corner.front, 0.55, -135, 215), size: 0.9, over: true },
];
for (const t of TREES) {
  const a = await actor('terrain/tree-mushroom.svg', 0.5 * t.size);
  a.root.position.set(t.at.x, t.at.y);
  Object.assign(a, { kind: 'tree', fixed: true, slots: [] });
  a.root.zIndex = island.root.zIndex + (t.over ? 0.5 : -1);
  world.addChild(a.root); pieces.push(a);
}
const roomy = p => p.L.top && p.L.top.w * p.root.scale.x > 34;
const empty = p => p.slots.every(slot => !slot.holder);

// every few seconds an empty piece pops to a new size
(async () => { for (;;) {
  await wait(rand(1.5, 3.5));
  const p = pick(pieces.filter(p => p.kind !== 'tree' && empty(p) && !p.popping && !p.falling));
  if (!p) continue;
  p.popping = true;
  const size = sizeFor(p.kind);
  gsap.timeline({ onComplete: () => { p.popping = false; } })
    .to(p.root.scale, { x: 0.5 * size * 0.8, y: 0.5 * size * 1.15, duration: 0.18, ease: 'power2.in' })
    .to(p.root.scale, { x: 0.5 * size, y: 0.5 * size, duration: 0.9, ease: 'elastic.out(1, 0.35)' });
} })();

// ---- the mions -----------------------------------------------------------------------------------
const MIONS = [
  ['fin-fish', 839.5, 138.5, 160.5], ['visor', 647, 155.5, 108], ['hat-juggler', 514, 165, 117.5], ['rock-mion', 100, 165, 130],
  ['horn-blob', 636, 293, 102.5], ['red-mushroom', 402.5, 245, 97.5], ['blue-helmet', 227.5, 332.5, 102.5], ['horned-ghost', 640, 360, 100],
  ['plant-mion', 0, 400, 110], ['worm', 355, 455, 87.5], ['seal', 670, 445, 100], ['pig', 225, 495, 110], ['red-ball', 800, 515, 95],
  ['horned-ghost-v2', 350, 530, 137], ['grub', 757, 572.5, 58], ['crawler', 615, 585, 135], ['teal-hood', 485, 650, 80], ['beanie', 429, 675.5, 58],
];
const mions = [];
const onIsland = [];
const where = m => {   // a mion's ground spot right now, and its drawing depth
  const at = m.at;
  if (at.piece) { const p = toWorld(at.piece, at.slot); return { ...p, z: at.piece.root.zIndex + 0.5 }; }
  return { x: at.x, y: at.y, z: Math.max(at.y, island.root.zIndex + 1) };
};
const free = (x, y, self) => !onIsland.some(m => m !== self && Math.hypot(m.at.x - x, (m.at.y - y) * 1.8) < 70);

for (const [name, left, top, width] of MIONS) {
  const src = `creatures/${name}.svg`;
  const viewWidth = +(await (texts[src] ??= fetch(src).then(r => r.text()))).match(/viewBox="\S+ \S+ (\S+)/)[1];
  const m = await actor(src, width / viewWidth, 1.25);
  place(m, left, top, width);
  m.name = name; m.phase = rand(0, 6.28); m.period = rand(2.2, 3.4);
  const foot = { x: m.root.x, y: m.root.y };
  if (islandSpots.some(s => Math.hypot(s.x - foot.x, s.y - foot.y) < 40)) { m.at = foot; onIsland.push(m); }
  else m.at = { pending: foot };
  m.root.eventMode = 'static'; m.root.cursor = 'pointer';
  m.root.on('pointertap', () => { m.urge = true; });
  world.addChild(m.root); mions.push(m);
}

// ---- moving everything each frame ----------------------------------------------------------------
let clock = 0;
const pointer = { x: -1, y: -1, on: false };
addEventListener('pointermove', e => Object.assign(pointer, { x: e.clientX, y: e.clientY, on: true }));
document.addEventListener('pointerleave', () => { pointer.on = false; });
const lay = () => {
  for (const p of pieces) {
    if (p.fixed || p.falling) continue;
    const a = p.angle + clock * p.ring.speed;
    p.root.position.set(centre.x + Math.cos(a) * p.ring.rx * p.wobble, centre.y + Math.sin(a) * p.ring.ry * p.wobble);
    p.root.zIndex = p.root.y;
    p.body.y = Math.sin(clock * 1.05 + p.phase) * 6 / p.root.scale.y;
  }
};
lay();
for (const m of mions.filter(m => m.at.pending)) {   // floaters start on the nearest empty piece
  const near = pieces.filter(p => p.kind !== 'tree' && empty(p) && roomy(p)).sort((a, b) => Math.hypot(a.root.x - m.at.pending.x, a.root.y - m.at.pending.y) - Math.hypot(b.root.x - m.at.pending.x, b.root.y - m.at.pending.y))[0];
  m.at = { piece: near, slot: near.slots[0] }; near.slots[0].holder = m;
}

app.ticker.add(t => {
  clock += t.deltaMS / 1000;
  lay();
  for (const g of twinkles) { const k = 0.5 + 0.5 * Math.sin(clock * g.speed * 2 + g.phase); g.alpha = 0.15 + 0.85 * k; g.scale.set(0.5 + 0.5 * k); }
  sky.x = world.x + (pointer.on ? (pointer.x / innerWidth - 0.5) * -14 : 0);
  for (const m of mions) {
    if (!m.flying) {
      const w = where(m), up = (1 - Math.cos((clock / m.period) * Math.PI * 2 + m.phase)) / 2;
      m.root.position.set(w.x, w.y); m.root.zIndex = w.z;
      m.body.y = -up * 4 / m.unit;
      if (m.root.shadow) m.root.shadow.alpha = 1 - up * 0.3;
    }
    for (const e of m.eyes) {   // pupils lean toward the cursor, at most a fifth of the eye, easing so they never snap
      let tx = 0, ty = 0;
      if (pointer.on) {
        const c = m.body.toGlobal(e.centre), dx = pointer.x - c.x, dy = pointer.y - c.y, d = Math.hypot(dx, dy) || 1;
        const pull = e.reach * Math.min(1, d / 160);
        tx = dx / d * pull; ty = dy / d * pull;
      }
      e.gx += (tx - e.gx) * 0.15; e.gy += (ty - e.gy) * 0.15;
      e.dot.position.set(e.home.x + e.gx, e.home.y + e.gy);
    }
  }
});

// ---- sound: all made with Web Audio, so there are no audio files -----------------------------------
const sound = { ctx: null, on: false };
const PENTA = [0, 3, 5, 7, 10];   // D minor pentatonic, so every boing fits the music
const hz = semis => 146.83 * 2 ** (semis / 12);   // semitones above D3
const hash = text => [...text].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function startSound() {
  const ctx = sound.ctx = new AudioContext();
  sound.master = ctx.createGain(); sound.master.gain.value = 0.7; sound.master.connect(ctx.destination);
  // a soft hall from a decaying noise burst, shared by the music and every sound
  const len = ctx.sampleRate * 2.6, impulse = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = impulse.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
  sound.hall = ctx.createConvolver(); sound.hall.buffer = impulse;
  const wet = ctx.createGain(); wet.gain.value = 0.32; sound.hall.connect(wet).connect(sound.master);
  sound.noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
  const n = sound.noise.getChannelData(0); for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
  music();
}
const out = (pan = 0, dry = 1, wet = 0.5) => {   // a gain that goes to the speakers and, a little, to the hall
  const { ctx } = sound, g = ctx.createGain(), p = ctx.createStereoPanner();
  p.pan.value = Math.max(-0.8, Math.min(0.8, pan));
  const d = ctx.createGain(), w = ctx.createGain(); d.gain.value = dry; w.gain.value = wet;
  g.connect(p); p.connect(d).connect(sound.master); p.connect(w).connect(sound.hall);
  return g;
};
const tone = (dest, type, f0, f1, t, len, peak, attack = 0.008) => {
  const { ctx } = sound, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len * 0.7);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(dest); o.start(t); o.stop(t + len + 0.05);
  return o;
};
const hiss = (dest, type, freq, q, t, len, peak) => {
  const { ctx } = sound, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = sound.noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  s.connect(f).connect(g).connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + len + 0.05);
};
// the background: an original space-arcade loop in D minor at 112 beats a minute, scheduled a little ahead of the clock
// bars run Dm, Bb, F, C; bass, a 16th-note arpeggio with echo, string swells and light drums, and every other pass a brass melody
function music() {
  const { ctx } = sound, BEAT = 60 / 112, STEP = BEAT / 4;
  const bus = out(0, 1, 0.35); bus.gain.setValueAtTime(0, ctx.currentTime); bus.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 3);
  const echo = ctx.createDelay(1), feedback = ctx.createGain(), echoLevel = ctx.createGain();
  echo.delayTime.value = BEAT * 0.75; feedback.gain.value = 0.35; echoLevel.gain.value = 0.4;
  echo.connect(feedback).connect(echo); echo.connect(echoLevel).connect(bus);
  const CHORDS = [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]];   // semitones above D3
  const LEAD = [   // [step in bar, semitones, length in steps]
    [[0, 12, 6], [6, 19, 2], [8, 19, 4], [12, 17, 2], [14, 15, 2]],
    [[0, 17, 4], [4, 15, 2], [6, 14, 2], [8, 12, 8]],
    [[0, 15, 4], [4, 19, 4], [8, 24, 6], [14, 22, 2]],
    [[0, 22, 4], [4, 19, 4], [8, 17, 4], [12, 14, 4]],
  ];
  const voice = (dest, type, semis, t, len, peak, attack, cutoff, detunes = [0]) => {
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.frequency.value = cutoff; f.Q.value = 1;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + Math.max(attack, len * 0.7)); g.gain.linearRampToValueAtTime(0, t + len);
    f.connect(g).connect(dest);
    for (const cents of detunes) { const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz(semis); o.detune.value = cents; o.connect(f); o.start(t); o.stop(t + len + 0.05); }
  };
  const drum = (kind, t) => {
    if (kind === 'kick') tone(bus, 'sine', 150, 42, t, 0.22, 0.5, 0.004);
    if (kind === 'snare') { hiss(bus, 'bandpass', 1900, 0.7, t, 0.16, 0.16); tone(bus, 'triangle', 200, 140, t, 0.08, 0.08); }
    if (kind === 'hat') hiss(bus, 'highpass', 7500, 0.7, t, 0.035, 0.035);
  };
  const play = (n, t) => {
    const bar = Math.floor(n / 16) % 4, at = n % 16, loop = Math.floor(n / 64), chord = CHORDS[bar];
    if (at === 0) {
      voice(bus, 'sawtooth', chord[0], t, BEAT * 4, 0.035, BEAT * 1.2, 1600, [-9, 9]);   // strings swell on every bar
      voice(bus, 'sawtooth', chord[1], t, BEAT * 4, 0.03, BEAT * 1.2, 1600, [-7, 7]);
      voice(bus, 'sawtooth', chord[2] + 12, t, BEAT * 4, 0.025, BEAT * 1.2, 1600, [-5, 5]);
    }
    if (at % 2 === 0) voice(bus, 'square', chord[0] - 12 + (at % 8 === 6 ? 12 : 0), t, STEP * 1.8, 0.09, 0.005, 420);   // driving bass
    const k = at % 6, arp = chord[k % 3] + 12 * (1 + Math.floor(k / 3));
    voice(echo, 'square', arp, t, STEP * 0.9, 0.035, 0.003, 2600); voice(bus, 'square', arp, t, STEP * 0.9, 0.03, 0.003, 2600);
    if (loop > 0 && loop % 2 === 1) for (const [step, semis, len] of LEAD[bar]) if (step === at) {
      voice(bus, 'sawtooth', semis, t, STEP * len, 0.06, 0.03, 2200, [-6, 6]);   // brass-like lead
      voice(echo, 'sawtooth', semis, t, STEP * len, 0.025, 0.03, 2200);
    }
    if (at === 0 || at === 8 || (at === 10 && bar === 3)) drum('kick', t);
    if (at === 4 || at === 12) drum('snare', t);
    if (at % 2 === 0) drum('hat', t);
  };
  let n = 0, next = ctx.currentTime + 0.2;
  setInterval(() => { while (next < ctx.currentTime + 0.15) { play(n++, next); next += STEP; } }, 25);
}
// each mion's own boing: smaller mions sing higher, and the name picks the tone colour and how far the pitch springs
const voiceOf = m => m.voice ??= (() => {
  const h = hash(m.name), size = m.unit * m.L.full.w;
  return { f: hz(PENTA[h % 5] + 12 * Math.max(0, Math.min(2, Math.round((150 - size) / 45)))), type: ['sine', 'triangle', 'square'][(h >>> 3) % 3], spring: 1.6 + ((h >>> 6) % 5) * 0.25, wobble: 5 + (h >>> 9) % 9 };
})();
const panOf = m => (m.root.x - centre.x) / 700;
function jumpSound(m) {
  if (!sound.on) return;
  const v = voiceOf(m), t = sound.ctx.currentTime, dest = out(panOf(m), 1, 0.25);
  const o = tone(dest, v.type, v.f, v.f * v.spring, t, 0.32, v.type === 'square' ? 0.05 : 0.12);
  const lfo = sound.ctx.createOscillator(), depth = sound.ctx.createGain();   // a little vibrato makes it a boing
  lfo.frequency.value = v.wobble; depth.gain.value = v.f * 0.06; lfo.connect(depth).connect(o.frequency); lfo.start(t); lfo.stop(t + 0.4);
  tone(dest, 'sine', v.f * 2, v.f * 2 * v.spring, t, 0.18, 0.03);
}
const surfaceOf = to => !to.piece ? 'grass' : /tile|block/.test(to.piece.kind) ? 'stone' : /sand/.test(to.piece.kind) ? 'sand' : 'rock';
function landSound(m, surface) {
  if (!sound.on) return;
  const t = sound.ctx.currentTime, dest = out(panOf(m), 1, 0.4), big = Math.min(1.4, m.unit * m.L.full.w / 100);
  if (surface === 'grass') { tone(dest, 'sine', 150, 60, t, 0.16, 0.22 * big); hiss(dest, 'bandpass', 3200, 0.8, t, 0.22, 0.05); }
  if (surface === 'stone') { tone(dest, 'triangle', 820, 420, t, 0.09, 0.16); hiss(dest, 'highpass', 4000, 0.7, t, 0.04, 0.08); tone(dest, 'sine', 210, 120, t, 0.12, 0.12 * big); }
  if (surface === 'sand') { hiss(dest, 'lowpass', 1400, 0.5, t, 0.32, 0.12); tone(dest, 'sine', 110, 55, t, 0.14, 0.12 * big); }
  if (surface === 'rock') { tone(dest, 'sine', 95, 42, t, 0.32, 0.32 * big); hiss(dest, 'lowpass', 380, 0.9, t, 0.2, 0.12); }
}
function fallSound(p) {   // a whistle sliding down, with a soft rush of air under it
  if (!sound.on) return;
  const t = sound.ctx.currentTime, dest = out((p.root.x - centre.x) / 700, 1, 0.3);
  tone(dest, 'sine', 880, 110, t + 0.25, 1.4, 0.07, 0.05);
  hiss(dest, 'lowpass', 900, 0.6, t + 0.25, 1.3, 0.05);
}
function popSound(p) {
  if (!sound.on) return;
  const t = sound.ctx.currentTime, dest = out((p.root.x - centre.x) / 700, 1, 0.5);
  tone(dest, 'sine', 320, 960, t, 0.16, 0.12); tone(dest, 'triangle', 1280, 1920, t + 0.05, 0.25, 0.03);
}
const soundButton = document.getElementById('sound');
soundButton.addEventListener('click', async () => {
  if (!sound.ctx) startSound();
  sound.on = !sound.on;
  await (sound.on ? sound.ctx.resume() : sound.ctx.suspend());
  soundButton.textContent = sound.on ? 'Sound on' : 'Sound off';
});
document.addEventListener('visibilitychange', () => { if (sound.ctx && sound.on) document.hidden ? sound.ctx.suspend() : sound.ctx.resume(); });

// ---- jumping -------------------------------------------------------------------------------------
const inView = p => p.x > W0 + 60 && p.x < W0 + VIEW_W - 60 && p.y > H0 + 60 && p.y < H0 + VIEW_H - 20;
function target(m) {
  const here = where(m), options = [];
  for (const p of pieces) {
    if (!roomy(p) || p.popping || p.falling) continue;
    for (const slot of p.slots.filter(slot => !slot.holder)) {
      const s = toWorld(p, slot), d = Math.hypot(s.x - here.x, s.y - here.y);
      if (d > 70 && d < 420 && inView(s)) options.push({ piece: p, slot, d });
    }
  }
  for (let i = 0; i < 6; i++) {
    const s = pick(islandSpots), d = Math.hypot(s.x - here.x, s.y - here.y);
    if (d > 60 && d < 380 && free(s.x, s.y, m)) options.push({ x: s.x, y: s.y, d });
  }
  return options.length ? pick(options) : null;
}

async function jump(m, to) {
  m.jumping = true;
  const from = m.at;
  if (to.piece) to.slot.holder = m; else onIsland.push(m);
  const a0 = where(m), b0 = where({ at: to });
  const dist = Math.hypot(b0.x - a0.x, b0.y - a0.y), time = 0.55 + dist / 900, height = 45 + dist * 0.3;
  const body = m.body.scale;
  await gsap.to(body, { x: 1.14, y: 0.84, duration: 0.16, ease: 'power2.out' });
  m.flying = true;
  jumpSound(m);
  if (from.piece) from.slot.holder = null; else onIsland.splice(onIsland.indexOf(m), 1);
  const s = { t: 0 };
  gsap.to(body, { x: 0.88, y: 1.14, duration: time * 0.35, ease: 'power2.out' });
  gsap.to(body, { x: 1, y: 1, duration: time * 0.4, delay: time * 0.5 });
  await gsap.to(s, { t: 1, duration: time, ease: 'none', onUpdate: () => {
    // both ends keep moving with their pieces, so the hop aims at where the target is now
    const a = where({ at: from.piece ? from : { x: a0.x, y: a0.y } }), b = where({ at: to }), t = s.t;
    m.root.position.set(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
    m.root.zIndex = lerp(a.z, b.z, t) + 0.3;
    m.body.y = -height * 4 * t * (1 - t) / m.unit;
    if (m.root.shadow) { m.root.shadow.alpha = 1 - 0.6 * Math.sin(Math.PI * t); }
  } });
  m.at = to.piece ? { piece: to.piece, slot: to.slot } : { x: to.x, y: to.y };
  m.flying = false;
  landSound(m, surfaceOf(to));
  if (m.root.shadow) m.root.shadow.alpha = 1;
  await gsap.timeline().to(body, { x: 1.22, y: 0.8, duration: 0.08, ease: 'power2.out' }).to(body, { x: 1, y: 1, duration: 0.6, ease: 'elastic.out(1, 0.4)' });
  m.jumping = false;
}

// ---- dropping a piece ----------------------------------------------------------------------------
// a clicked piece shivers, stops floating and falls off the screen; a fresh one pops in at its place in the ring a moment later
async function drop(p) {
  if (p.falling || p.popping) return;
  p.falling = true;
  fallSound(p);
  const tl = gsap.timeline();
  tl.to(p.root, { rotation: 0.05, duration: 0.05, yoyo: true, repeat: 5, ease: 'sine.inOut' });
  if (p.root.shadow) tl.to(p.root.shadow, { alpha: 0, duration: 0.25 }, 0);
  tl.to(p.root, { y: H0 + VIEW_H + 500, rotation: rand(-0.6, 0.6), duration: 1.4, ease: 'power2.in' });
  await tl;
  // a mion that rode it down pops back in on the island; one already mid-jump got away
  for (const slot of p.slots) {
    const m = slot.holder;
    if (!m) continue;
    slot.holder = null;
    if (m.jumping) continue;
    const spot = pick(islandSpots.filter(s => free(s.x, s.y, m)));
    m.at = { x: spot.x, y: spot.y }; onIsland.push(m);
    m.body.scale.set(0);
    gsap.to(m.body.scale, { x: 1, y: 1, duration: 0.8, delay: 0.3, ease: 'elastic.out(1, 0.4)' });
  }
  p.root.visible = false;
  await wait(rand(1.2, 2.4));
  p.root.rotation = 0; p.root.scale.set(0.001); p.root.visible = true;
  if (p.root.shadow) p.root.shadow.alpha = 1;
  p.falling = false; p.popping = true;
  popSound(p);
  const size = 0.5 * sizeFor(p.kind);
  await gsap.to(p.root.scale, { x: size, y: size, duration: 0.9, ease: 'elastic.out(1, 0.4)' });
  p.popping = false;
}

for (const m of mions) (async () => {
  await wait(rand(0.5, 6));
  for (;;) {
    for (let waited = 0, goal = rand(2.5, 8); waited < goal && !m.urge; waited += 0.1) await wait(0.1);
    m.urge = false;
    const to = target(m);
    if (to) await jump(m, to);
  }
})();
</script>

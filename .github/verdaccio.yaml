# Throwaway local registry for the release e2e. The CI job publishes the packed
# tarballs here, then a consumer fixture installs from it — which faithfully
# exercises the launcher -> mionjs-native-compiler-<os>-<arch> optional-dependency
# os/cpu resolution that a bare file-tarball install can't.
#
# Anonymous publish + read are allowed on purpose (ephemeral, localhost only).
# Everything not published locally (vite, vitest, deps) proxies to npmjs.
storage: /tmp/verdaccio-storage
# The per-platform mionjs-native-compiler-* tarballs (the packed Go resolver) exceed
# verdaccio's 10mb default, which 413s the publish on the host-npx e2e backend.
max_body_size: 100mb
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    cache: false
packages:
  # The packages UNDER TEST (both families live under @mionjs/* now): served ONLY
  # from the locally published tarballs, never proxied to real npm. Otherwise
  # publishing a version already live on npm 409s (`cannot publish over the
  # previously published versions`), and an install could even resolve the real-npm
  # build instead of the packed tarball. MUST precede the '@*/*' rule - verdaccio
  # matches the first pattern. ONE block: a repeated key is a YAML error, and
  # verdaccio then refuses the whole file ("it does not look like a valid config").
  # Kept in step with the container twin at
  # container/pre-publish-e2e/registry/verdaccio.yaml so the host-npx backend never
  # resolves a package the container backend serves locally.
  '@mionjs/*':
    access: $all
    publish: $all
    unpublish: $all
  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs
publish:
  allow_offline: true
log:
  type: stdout
  format: pretty
  level: warn

name: Resolver binaries
description: >
  Restore the prebuilt mion-bin/mion + mion-bin/extract-fn-bodies (and their stamps),
  plus mion-bin/code-digest under its own key,
  from the Actions cache, keyed on the content of every Go input they link. The ONLY
  place a job sets up Go and the tsgolint submodule: on a hit a job that only RUNS
  the binaries skips the submodule, setup-go and the Go build cache entirely; on a
  miss this builds them and saves the entry for every later job.

  Needs Node (run ./.github/actions/bootstrap first): the key is computed by
  `node scripts/core/build.mjs --cache-key`, with git and node only.

inputs:
  toolchain:
    description: >
      'true' sets up Go + the submodule + the Go build cache even on a hit, for a job
      that runs `go test` / `go run` or builds other Go targets. 'false' (default)
      sets them up only on a miss.
    default: 'false'

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: |
        echo "key=$(node scripts/core/build.mjs --cache-key)" >> "$GITHUB_OUTPUT"
        echo "digest-key=$(node scripts/core/build.mjs --digest-cache-key)" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          mion-bin/mion
          mion-bin/.mion.stamp
          mion-bin/extract-fn-bodies
          mion-bin/.extract-fn-bodies.stamp
        key: ${{ steps.key.outputs.key }}

    # code-digest has its own key, so an internal/ edit never sends the gate (which restores only this) to raw hashing.
    - id: restore-digest
      uses: actions/cache/restore@v4
      with:
        path: |
          mion-bin/code-digest
          mion-bin/.code-digest.stamp
        key: ${{ steps.key.outputs.digest-key }}

    # Never `submodules: recursive`: it also pulls typescript-go's TypeScript corpus (~620 MB), which no build reads.
    # The resolver builds only with the patches applied; `git apply`, not `git am`, needs no committer identity on CI.
    # `cd`, not `git -C`: bash expands the patch glob in its own directory, before git ever moves.
    - name: Fetch the tsgolint submodule without the TypeScript corpus, and apply its patches
      id: tsgo
      if: inputs.toolchain == 'true' || steps.restore.outputs.cache-hit != 'true' || steps.restore-digest.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git submodule update --init --depth 1 ts-go-runtypes/third_party/tsgolint
        git -C ts-go-runtypes/third_party/tsgolint submodule update --init --depth 1 typescript-go
        (cd ts-go-runtypes/third_party/tsgolint/typescript-go && git apply --3way ../patches/*.patch)
        echo "sha=$(git -C ts-go-runtypes/third_party/tsgolint rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Before the cache restore so the installed Go version can join its key; cache: false leaves GOCACHE to us.
    - uses: actions/setup-go@v6
      id: go
      if: inputs.toolchain == 'true' || steps.restore.outputs.cache-hit != 'true' || steps.restore-digest.outputs.cache-hit != 'true'
      with:
        go-version-file: ts-go-runtypes/.go-version
        cache: false

    # setup-go keys only on go.sum, which a tsgolint bump never moves (tsgo deps come via local `replace`).
    # So the key is the tsgolint pin, which also pins typescript-go and its patches.
    # GOCACHE is content-addressed: our internal/ + cmd/ edits recompile cheaply on the cached tsgo objects.
    # Each entry embeds its Go version, and website-deploy's arm64 objects must never restore on x64: both are keyed.
    # An exact-key hit never re-saves, so a stale cache never heals; restore-keys stay within one Go version for that.
    # CACHE SALT (`v2`): action IDs embed absolute `replace`d package paths (no -trimpath); bump on a Go tree move.
    - name: Restore Go build cache (keyed on Go + the tsgolint pin, not our sources)
      if: inputs.toolchain == 'true' || steps.restore.outputs.cache-hit != 'true' || steps.restore-digest.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-${{ runner.arch }}-gocache-v2-go${{ steps.go.outputs.go-version }}-${{ hashFiles('ts-go-runtypes/go.mod', 'ts-go-runtypes/go.sum') }}-${{ steps.tsgo.outputs.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gocache-v2-go${{ steps.go.outputs.go-version }}-

    - name: Build the resolver binaries
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/core/build.mjs go extract

    # Parallel misses race here; the loser's save is refused and harmless.
    - name: Save the resolver binaries
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          mion-bin/mion
          mion-bin/.mion.stamp
          mion-bin/extract-fn-bodies
          mion-bin/.extract-fn-bodies.stamp
        key: ${{ steps.key.outputs.key }}

    - name: Build the code-digest tool
      if: steps.restore-digest.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/core/build.mjs digest

    - name: Save the code-digest tool
      if: steps.restore-digest.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          mion-bin/code-digest
          mion-bin/.code-digest.stamp
        key: ${{ steps.key.outputs.digest-key }}

name: Bootstrap mion toolchain
description: Apply tsgolint patches, set up Go + Node + pnpm, and install workspace deps.

# Requires the caller to have already run actions/checkout with
# `submodules: recursive` (a local composite action can only run once the repo
# — including this file — is on disk, and the patches need the submodule).
runs:
  using: composite
  steps:
    # tsgolint vendors its typescript-go fork as a submodule + patch set; the Go
    # resolver only builds once the patches are applied to the working tree.
    # `git apply` (not `git am`) so no committer identity is needed on CI.
    - name: Apply tsgolint patches to typescript-go
      shell: bash
      run: |
        cd ts-go-runtypes/third_party/tsgolint/typescript-go
        git apply --3way ../patches/*.patch

    # Read the pinned tsgolint revision so the Go build-cache key tracks it (see
    # the cache step below).
    - name: Resolve the tsgolint pin (for the Go build-cache key)
      id: tsgo
      shell: bash
      run: echo "sha=$(git -C ts-go-runtypes/third_party/tsgolint rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # setup-go runs BEFORE the cache restore so the installed Go version can join
    # the key below. It never touches GOCACHE itself (cache: false).
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version: '1.26'
        cache: false

    # setup-go's built-in cache keys ONLY on go.sum, which never moves when the
    # tsgolint submodule is bumped (every typescript-go dep comes in through a
    # local `replace` path, not go.sum). That combination silently freezes the
    # cache on the pre-bump objects and recompiles all of tsgo on every run after
    # a bump. So we manage the cache ourselves and key it on the tsgolint pin,
    # which also covers the nested typescript-go commit and the patch files (both
    # live inside the tsgolint submodule). GOCACHE is content-addressed, so our
    # internal/ + cmd/ code — which changes almost every PR — is a cheap
    # recompile that reuses the cached tsgo objects.
    #
    # The INSTALLED Go version is in the key too: `go-version: '1.26'` floats to
    # the newest patch, and every GOCACHE entry embeds the exact toolchain. Without
    # it a patch release left the exact-key cache full of unusable objects, a
    # full tsgo recompile (~2 min) in EVERY Go job, never healed because
    # actions/cache skips the save on an exact-key hit. The restore-keys fallback
    # stays inside the same Go version for the same reason.
    #
    # CACHE SALT (`v2`): GOCACHE action IDs also embed the ABSOLUTE source paths
    # of locally-`replace`d packages (these builds run WITHOUT -trimpath). Bump
    # the salt whenever the Go source tree moves, or old-path objects get restored
    # that Go cannot reuse, with the same never-healing result.
    - name: Restore Go build cache (keyed on Go + the tsgolint pin, not our sources)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-gocache-v2-go${{ steps.go.outputs.go-version }}-${{ hashFiles('ts-go-runtypes/go.mod', 'ts-go-runtypes/go.sum') }}-${{ steps.tsgo.outputs.sha }}
        restore-keys: |
          ${{ runner.os }}-gocache-v2-go${{ steps.go.outputs.go-version }}-

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v5
      with:
        node-version: 26
        cache: pnpm

    - name: Install workspace deps
      shell: bash
      run: pnpm install --frozen-lockfile

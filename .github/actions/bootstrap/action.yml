name: Bootstrap mion workspace
description: Set up Node + pnpm and install workspace deps. Go and the tsgolint submodule live in ./.github/actions/resolver.

# Needs a prior actions/checkout: a local composite action runs only once the repo is on disk.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v5
      with:
        node-version: 26
        cache: pnpm

    - name: Install workspace deps
      shell: bash
      run: pnpm install --frozen-lockfile

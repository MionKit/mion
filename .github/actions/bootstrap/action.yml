name: Bootstrap mion workspace
description: Set up Node + pnpm and install workspace deps. Go and the tsgolint submodule live in ./.github/actions/resolver.

# Requires the caller to have already run a plain actions/checkout (a local
# composite action can only run once the repo, including this file, is on disk).
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v5
      with:
        node-version: 26
        cache: pnpm

    - name: Install workspace deps
      shell: bash
      run: pnpm install --frozen-lockfile

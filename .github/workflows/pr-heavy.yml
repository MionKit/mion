name: pr · website + benchmarks (label-gated)

# The two heavy lanes nothing else runs on a PR.
#
# ci.yml covers lint, typecheck, the vitest projects and the Go suite. The
# website build and the benchmarks are containerized and slow, so they only ran
# from website-deploy.yml, which is prod-only and DEPLOYS. That left no way to
# prove a PR does not break either one before it lands, which is exactly what a
# repo-wide rename needs.
#
# So: same shape as drizzle-e2e.yml, a label opts a PR in. Two independent
# labels rather than one, because the website build is ~10 minutes and the
# benchmarks are much longer; most PRs that want one do not want the other.
#
#   website   build BOTH docs sites and assert every page prerenders
#   bench     run the validation benchmarks
#
# Deliberately NOT pull_request_target: that would hand secrets and write
# permissions to fork code. And deliberately no deploy step — this proves the
# build, website-deploy.yml remains the only thing that ships a site.

on:
  # `labeled` fires when the label is added; `synchronize` re-runs while the
  # label is still on, so a labelled PR keeps being checked as it grows.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: pr-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: build both docs sites
    if: contains(github.event.pull_request.labels.*.name, 'website')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `submodules: recursive` + bootstrap is the repo's ONE setup: the Go
      # resolver only builds once tsgolint's patches are applied to its vendored
      # typescript-go, and bootstrap is what applies them.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/bootstrap
      - name: Pull the prebuilt shared image (CI never builds it)
        uses: ./.github/actions/pull-shared-image
        with:
          github-token: ${{ secrets.GHCR_PAT || github.token }}
      - name: Cache the playground wasm
        uses: ./.github/actions/cache-playground-wasm
      # --no-bench reuses the committed bench data: this job proves the SITE
      # builds and every page prerenders, not that the numbers are fresh. The
      # bench job below is what re-measures.
      - name: Build both docs sites
        run: pnpm rtx website build --no-bench

  bench:
    name: validation benchmarks
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/free-disk
      - uses: ./.github/actions/bootstrap
      - name: Pull the prebuilt shared image (CI never builds it)
        uses: ./.github/actions/pull-shared-image
        with:
          github-token: ${{ secrets.GHCR_PAT || github.token }}
      # --quick: a PR wants "the lanes still run and answer correctly", not
      # publishable numbers. Every lane still has to answer correctly AND reject
      # an invalid payload before it is measured, which is the part that catches
      # a broken competitor after a rename.
      - name: Run the benchmarks
        run: pnpm rtx bench --quick

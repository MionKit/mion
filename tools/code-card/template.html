<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{pageTitle}}</title>
    <style>
      {{fontFaces}}
      /* mion olive from container/website/sites/rpc/theme.css, on a neutral grey */
      :root {
        --bg-from: #2a2b2e;
        --bg-mid: #1c1d20;
        --bg-to: #161719;
        --glow: #79af43;
        --accent: #79af43;
        --accent-mid: #8aa85e;
        --accent-light: #bdd09d;
        --title: #ffffff;
        --text-muted: #a1a1aa;
        --text-footer: #d4d4d8;
        --code-bg: #1a1b26;
        --bar-bg: #16161e;
        --file-name: #7a82a8;
        --page-padding: {{padding}};
        --code-size: {{codeSize}};
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        zoom: {{zoom}};
        width: {{pageWidth}}px;
        margin: 0;
        font-family: Inter, sans-serif;
        background: var(--bg-to);
      }
      .stage {
        padding: var(--page-padding);
        background:
          radial-gradient(700px 420px at 6% 0%, color-mix(in srgb, var(--glow) 20%, transparent), transparent 60%),
          radial-gradient(700px 420px at 100% 100%, color-mix(in srgb, var(--glow) 13%, transparent), transparent 60%),
          linear-gradient(135deg, var(--bg-from), var(--bg-mid) 55%, var(--bg-to));
      }
      h1 {
        color: var(--title);
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1.1;
      }
      h1 .accent {
        background: linear-gradient(90deg, var(--accent-light), var(--accent));
        -webkit-background-clip: text;
        color: transparent;
      }
      .sub {
        color: var(--text-muted);
        font-size: 20px;
        margin-top: 12px;
        font-weight: 500;
      }
      .win {
        margin-top: 36px;
        background: var(--code-bg);
        border-radius: 16px;
        box-shadow:
          0 30px 80px #0009,
          0 0 0 1px #ffffff14;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 20px;
        background: var(--bar-bg);
        border-bottom: 1px solid #ffffff0d;
      }
      .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
      }
      .file {
        margin-left: 14px;
        color: var(--file-name);
        font: 500 15px 'JetBrains Mono', monospace;
      }
      .win pre {
        font: 400 var(--code-size) / 1.7 'JetBrains Mono', 'Noto Color Emoji', monospace;
        padding: 28px 32px 32px;
        white-space: pre;
        background: transparent !important;
      }
      /* Flex drops the whitespace between rows, so each row, emoji or not, is one full band. */
      .win pre code {
        display: flex;
        flex-direction: column;
      }
      .win pre .line {
        min-height: calc(var(--code-size) * 1.7);
      }
      .win pre .line.hl {
        background: color-mix(in srgb, var(--accent-mid) 12%, transparent);
        border-left: 3px solid var(--accent-mid);
        margin: 0 -32px;
        padding-left: 29px;
      }
      /* stats fence: tiles + one before / after bar chart */
      .stats {
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
      .tiles {
        display: flex;
        gap: 16px;
      }
      .tile {
        flex: 1;
        padding: 22px 22px 20px;
        border-radius: 12px;
        background: #ffffff08;
        box-shadow: 0 0 0 1px #ffffff12;
      }
      .tile b {
        display: block;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: -1.5px;
        line-height: 1;
        background: linear-gradient(90deg, var(--accent-light), var(--accent));
        -webkit-background-clip: text;
        color: transparent;
      }
      .tile span {
        display: block;
        margin-top: 10px;
        color: var(--text-muted);
        font-size: 17px;
        font-weight: 500;
        line-height: 1.3;
      }
      .diff {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 18px 22px;
        border-radius: 12px;
        background: #ffffff08;
        box-shadow: 0 0 0 1px #ffffff12;
        font: 700 30px 'JetBrains Mono', monospace;
      }
      .diff .what {
        font: 600 19px Inter, sans-serif;
        color: var(--text-footer);
        margin-right: auto;
      }
      .diff .add {
        color: #3fb950;
      }
      .diff .del {
        color: #f85149;
      }
      .diff .squares {
        display: flex;
        gap: 4px;
      }
      .diff .squares i {
        width: 18px;
        height: 18px;
        border-radius: 3px;
      }
      .diff .squares .add {
        background: #3fb950;
      }
      .diff .squares .del {
        background: #f85149;
      }
      .diff .squares .none {
        background: #ffffff22;
      }
      .chart {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .chart .row {
        display: grid;
        grid-template-columns: 220px 1fr 300px;
        align-items: center;
        gap: 20px;
      }
      .chart .label {
        color: var(--text-footer);
        font-size: 18px;
        font-weight: 600;
      }
      .chart .track {
        position: relative;
        height: 26px;
      }
      .chart i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 6px;
      }
      .chart .before {
        background: #ffffff1c;
      }
      .chart .after {
        background: linear-gradient(90deg, var(--accent), var(--accent-light));
        box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
      }
      .chart .value {
        font: 500 17px 'JetBrains Mono', monospace;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .chart .value strong {
        color: var(--title);
        font-weight: 700;
      }
      .chart .value em {
        font-style: normal;
        margin-left: 10px;
        color: var(--accent-light);
      }
      .chart .legend {
        display: flex;
        gap: 22px;
        margin-left: 240px;
        color: var(--text-muted);
        font-size: 15px;
      }
      .chart .legend span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .chart .legend i {
        position: static;
        width: 22px;
        height: 12px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        margin-top: 32px;
        color: var(--text-footer);
        font-size: 18px;
        font-weight: 600;
      }
      .badge {
        font: 500 17px 'JetBrains Mono', monospace;
        color: #e8edd9;
        background: color-mix(in srgb, var(--accent) 20%, transparent);
        padding: 6px 12px;
        border-radius: 8px;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>{{title}}</h1>
      {{subtitle}}
      <div class="win">
        <div class="bar">
          <i class="dot" style="background: #ff5f57"></i><i class="dot" style="background: #febc2e"></i><i class="dot" style="background: #28c840"></i>{{file}}
        </div>
        {{code}}
      </div>
      {{foot}}
    </div>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{pageTitle}}</title>
    <style>
      {{fontFaces}}
      {{theme}}
      {{css}}
      body {
        zoom: {{zoom}};
        margin: 0;
        background: #161719;
      }
      .cc-page {
        width: {{pageWidth}}px;
      }
      .cc-preview {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        font: 14px system-ui, sans-serif;
        color: #e4e4e7;
      }
      .cc-preview button {
        font: inherit;
        padding: 4px 12px;
        border-radius: 6px;
        border: 1px solid #52525b;
        background: #27272a;
        color: inherit;
        cursor: pointer;
      }
      .cc-errors {
        padding: 12px 16px;
        background: #7f1d1d;
        color: #fff;
        font: 14px/1.5 system-ui, sans-serif;
        white-space: pre-wrap;
      }
      .cc-errors:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    {{controls}}
    <div class="cc-page" data-site="rpc">{{card}}</div>
    <script type="module">
      {{player}}
      // Layout checks: measured here, read by `card shot` (window.cardChecks) and shown by `card serve`.
      const card = document.querySelector('.code-card');
      window.cardPlayer = {arm, play, pause, reset, card};
      window.cardChecks = document.fonts.ready.then(() => {
        const errors = [];
        const stage = card.querySelector('.stage').getBoundingClientRect();
        const text = (el) => JSON.stringify(el.textContent.trim().slice(0, 60));
        for (const el of card.querySelectorAll('[data-check~="one-line"]')) {
          const style = getComputedStyle(el);
          // client rects are in zoomed pixels, computed sizes are not
          const lineHeight = (parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.25) * (el.currentCSSZoom ?? 1);
          const range = document.createRange();
          range.selectNodeContents(el);
          const rects = [...range.getClientRects()];
          const height = Math.max(...rects.map((r) => r.bottom)) - Math.min(...rects.map((r) => r.top));
          if (height > lineHeight * 1.5) errors.push(`wraps onto a second line: ${text(el)}`);
        }
        for (const el of card.querySelectorAll('[data-check~="no-overflow"]'))
          if (el.scrollWidth > el.clientWidth + 1) errors.push(`too wide, scrolls sideways: ${text(el)}`);
        for (const el of card.querySelectorAll('.stage *'))
          if (!el.closest('[data-check~="no-overflow"]') && el.getBoundingClientRect().right > stage.right + 0.5)
            errors.push(`sticks out of the card: ${text(el)}`);
        return [...new Set(errors)];
      });
      {{previewScript}}
    </script>
  </body>
</html>
